services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      DATA_DIR: /data
      TRUST_PROXY: "true"
    volumes:
      - plates-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "none"   # no request/IP logs written anywhere

volumes:
  plates-data:
